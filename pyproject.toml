[project]
name = "image-inference"
version = "0.1.0"
description = "Asynchronous image-inference API with YOLOv8 and Tesseract backends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
    "pytesseract>=0.3.13,<1.0",
    "ultralytics>=8.3,<9.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
